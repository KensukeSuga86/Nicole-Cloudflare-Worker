name: Deploy Nicole Worker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test historical comet lookup
        shell: bash
        run: |
          set -euo pipefail
          URL='https://astro-nicole.hideld12.workers.dev/night-comets?lat=42.9236&lon=143.1961&alt_m=40&obs_time=2020-07-15T21%3A00%3A00%2B09%3A00&vmag_max=12&max_comets=20&step_minutes=15&candidate_mode=hybrid'
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -H 'Origin: http://127.0.0.1:18777' -D headers.txt "$URL" -o response.json
          grep -qi '^access-control-allow-origin: http://127.0.0.1:18777' headers.txt
          python3 - <<'PY'
          import json, sys
          data=json.load(open("response.json",encoding="utf-8"))
          print(json.dumps({
              "ok":data.get("ok"),
              "candidateMode":data.get("candidateMode"),
              "historical":data.get("historical"),
              "candidateStats":data.get("candidateStats"),
              "warnings":data.get("warnings"),
              "comets":[{"designation":c.get("designation"),"name":c.get("name"),"ephemerisSource":c.get("ephemerisSource")} for c in data.get("comets",[])]
          },ensure_ascii=False,indent=2))
          names=" ".join(str(c.get("designation",""))+" "+str(c.get("name","")) for c in data.get("comets",[])).upper()
          neo=next((c for c in data.get("comets",[]) if "2020 F3" in (str(c.get("designation",""))+" "+str(c.get("name",""))).upper() or "NEOWISE" in (str(c.get("designation",""))+" "+str(c.get("name",""))).upper()), None)
          if not neo:
              print("NEOWISE was not returned by /night-comets", file=sys.stderr)
              sys.exit(1)
          pts=neo.get("points") or []
          print(json.dumps({"neowisePointCount":len(pts),"first":pts[0] if pts else None,"last":pts[-1] if pts else None,"middle":pts[len(pts)//2] if pts else None},ensure_ascii=False,indent=2))
          # Position sanity check: NEOWISE at 2020-07-15T12:00Z was near RA 118 deg, Dec +47 deg.
          # Guards against RA/Dec column shifts (e.g. Dec reported as 0).
          mid=pts[len(pts)//2] if pts else None
          if not mid or not (108 <= float(mid.get("ra",-1)) <= 128 and 42 <= float(mid.get("dec",-99)) <= 52):
              print(f"NEOWISE position out of expected range: {mid}", file=sys.stderr)
              sys.exit(1)
          bad=[c.get("designation") for c in data.get("comets",[]) if c.get("points") and all(float(p.get("dec",0))==0.0 for p in c["points"])]
          if bad:
              print(f"Comets with all-zero declination (parser regression): {bad}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Smoke test meteor shower data
        shell: bash
        run: |
          set -euo pipefail
          for Y in 2026 2027; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 -H 'Origin: http://127.0.0.1:18777' "https://astro-nicole.hideld12.workers.dev/meteors?year=${Y}" -o "meteors-${Y}.json"
            python3 -c "import json,sys; d=json.load(open('meteors-${Y}.json')); n=len(d.get('showers',[])); print('${Y}', d.get('ok'), n); sys.exit(0 if d.get('ok') and n>=13 else 1)"
          done
